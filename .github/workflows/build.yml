name: Windows build
on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check account creation authorization
        run: node .\tests\CreateAdminChecks.mjs
      - name: Restore and build WinForms client
        shell: powershell
        run: .\scripts\Build-Team.ps1 -Configuration ${{ matrix.configuration }}
      - name: Check Supabase requests and legacy conversion offline
        shell: powershell
        run: |
          .\scripts\Test-Supabase.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-LegacyConversion.ps1
